<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AuthHub 管理台</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
  <script src="/admin/assets/admin-tailwind.config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="/admin/assets/admin.js"></script>
</head>
<body class="h-screen overflow-hidden bg-[#f6f8fb] text-slate-800">
  <section id="login-view" class="grid min-h-screen place-items-center px-4 py-8">
    <div class="grid w-full max-w-[880px] overflow-hidden rounded-xl border border-slate-200 bg-white shadow-float md:grid-cols-[1.05fr_.95fr]">
      <div class="hidden bg-[#f3f7fc] p-10 md:flex md:flex-col md:justify-between">
        <div class="inline-flex h-11 w-11 items-center justify-center rounded-xl bg-brand-600 text-white shadow-sm"><i data-lucide="shield-check"></i></div>
        <div>
          <h1 class="text-[28px] font-semibold text-slate-900">AuthHub</h1>
          <p class="mt-3 max-w-[330px] text-sm leading-6 text-slate-600">统一管理身份、角色、权限和业务模块，并在接入前直接验证授权结果。</p>
        </div>
        <div class="flex items-center gap-2 text-xs text-slate-500"><i data-lucide="lock-keyhole" class="h-3.5 w-3.5"></i> 仅系统管理员可访问</div>
      </div>
      <form id="login-form" class="p-7 sm:p-10" novalidate>
        <div class="mb-8 md:hidden"><div class="mb-4 inline-flex h-10 w-10 items-center justify-center rounded-lg bg-brand-600 text-white"><i data-lucide="shield-check"></i></div><h1 class="text-xl font-semibold text-slate-900">AuthHub 管理台</h1></div>
        <div class="mb-7"><h2 class="text-xl font-semibold text-slate-900">管理员登录</h2><p class="mt-1 text-sm text-slate-500">使用 AuthHub 系统管理员账户继续</p></div>
        <div id="login-error" class="mb-4 hidden items-start gap-2 rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-800"><i data-lucide="circle-alert" class="mt-0.5 h-4 w-4 shrink-0"></i><span></span></div>
        <label class="label" for="username">用户名</label>
        <input id="username" class="field mb-4" name="username" autocomplete="username" required value="admin">
        <label class="label" for="password">密码</label>
        <div class="relative mb-6"><input id="password" class="field pr-10" name="password" type="password" autocomplete="current-password" required><button id="toggle-password" type="button" class="absolute right-1 top-0 h-[38px] w-9 text-slate-400 hover:text-slate-700" title="显示密码"><i data-lucide="eye"></i></button></div>
        <button id="login-submit" class="btn-primary w-full" type="submit"><i data-lucide="log-in"></i><span>登录</span></button>
      </form>
    </div>
  </section>

  <section id="app-view" class="hidden h-screen overflow-hidden md:flex">
    <div id="sidebar-backdrop" class="sidebar-backdrop fixed inset-0 z-30 hidden bg-slate-950/25 md:hidden"></div>
    <aside id="sidebar" class="desktop-sidebar fixed inset-y-0 left-0 z-40 flex w-[236px] flex-col border-r border-slate-200 bg-white md:static md:translate-x-0">
      <div class="flex h-16 shrink-0 items-center gap-3 border-b border-slate-100 px-5"><div class="grid h-8 w-8 place-items-center rounded-lg bg-brand-600 text-white"><i data-lucide="shield-check" class="h-[17px] w-[17px]"></i></div><span class="text-[15px] font-semibold text-slate-900">AuthHub</span></div>
      <nav class="min-h-0 flex-1 overflow-y-auto px-3 py-4">
        <p class="mb-2 px-3 text-[11px] font-semibold uppercase text-slate-400">工作台</p>
        <button data-page="overview" class="nav-item active"><i data-lucide="layout-dashboard"></i>概览</button>
        <p class="mb-2 mt-6 px-3 text-[11px] font-semibold uppercase text-slate-400">能力验证</p>
        <button data-page="authorize" class="nav-item"><i data-lucide="badge-check"></i>权限校验</button>
        <p class="mb-2 mt-6 px-3 text-[11px] font-semibold uppercase text-slate-400">权限配置</p>
        <button data-page="users" class="nav-item"><i data-lucide="users"></i>用户</button>
        <button data-page="organizations" class="nav-item"><i data-lucide="network"></i>组织</button>
        <button data-page="roles" class="nav-item"><i data-lucide="key-round"></i>角色</button>
        <button data-page="permissions" class="nav-item"><i data-lucide="key-square"></i>权限</button>
        <p class="mb-2 mt-6 px-3 text-[11px] font-semibold uppercase text-slate-400">资源与审计</p>
        <button data-page="modules" class="nav-item"><i data-lucide="boxes"></i>业务模块</button>
        <button data-page="resources" class="nav-item"><i data-lucide="database-zap"></i>资源</button>
        <button data-page="resource-instances" class="nav-item"><i data-lucide="list-tree"></i>资源实例</button>
        <button data-page="audit" class="nav-item"><i data-lucide="scroll-text"></i>审计日志</button>
      </nav>
      <div class="border-t border-slate-100 px-4 py-3 text-xs text-slate-400">AuthHub Framework</div>
    </aside>
    <div id="app-main" class="flex h-full min-w-0 flex-1 flex-col">
      <header class="flex h-16 shrink-0 items-center justify-between border-b border-slate-200 bg-white px-4 sm:px-6">
        <div class="flex min-w-0 items-center gap-3"><button id="menu-button" class="btn-icon md:hidden" title="展开导航"><i data-lucide="menu"></i></button><div class="min-w-0"><span class="text-sm font-medium text-slate-800" id="shell-title">概览</span><span class="mx-2 text-slate-300">/</span><span class="text-sm text-slate-500" id="shell-context">AuthHub</span></div></div>
        <div class="flex items-center gap-2"><span id="current-user" class="hidden max-w-[140px] truncate text-sm text-slate-600 sm:block"></span><button id="logout-button" class="btn-icon" title="退出登录"><i data-lucide="log-out"></i></button></div>
      </header>
      <main id="main-content" class="min-h-0 flex-1 overflow-y-auto p-4 sm:p-6"><div id="notice" class="mb-4 hidden"></div><div id="content"><div class="initial-loading" role="status"><span class="loading-spinner" aria-hidden="true"></span><span>正在加载管理台...</span></div></div></main>
    </div>
  </section>

  <dialog id="modal" class="modal"></dialog>
  <dialog id="confirm-modal" class="modal max-w-md"></dialog>
  <div id="toast" class="pointer-events-none fixed bottom-5 right-5 z-50 hidden max-w-sm rounded-lg border px-3 py-2 text-sm shadow-float"></div>
</body>
</html>
