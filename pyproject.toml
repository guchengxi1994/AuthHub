[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "auth-hub"
version = "0.1.0"
description = "Embeddable authentication and RBAC authorization framework."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AuthHub contributors" }]
keywords = ["authentication", "authorization", "rbac", "iam", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["build>=1.2", "httpx>=0.27", "fastapi>=0.110"]

[project.urls]
Homepage = "https://github.com/your-org/auth-hub"
Repository = "https://github.com/your-org/auth-hub"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_hub"]

